[project]
name = "countersign"
version = "1.0.0"
description = "A second-line control function that discovers the enterprise, proposes the control programme, runs it on a schedule, and brings a person only what needs a signature."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "strands-agents>=1.51,<2",
    "strands-agents-tools>=0.8,<1",
    "boto3>=1.43,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "starlette>=1,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
countersign = "countersign.cli:main"

[project.optional-dependencies]
eval = ["strands-agents-evals"]
dev = ["pytest", "pytest-asyncio", "ruff", "httpx>=0.28,<1"]
demo = ["playwright", "edge-tts"]
security = ["pip-audit==2.10.1"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
countersign = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "corpus/**/*.json", "corpus/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
